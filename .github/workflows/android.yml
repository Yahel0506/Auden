name: Release

# Every push to main looks at the version in build.gradle.kts. If no release
# carries that tag yet, the phone, TV and watch apps are built, signed and
# published as a GitHub release — which is exactly what the in-app updater
# polls (AppUpdateChecker). To ship: bump bitchordVersionName / VersionCode
# (and blank or bump bitchordBetaSuffix) in build.gradle.kts, add the version's
# changelog (changelog/<version>/en.md, see changelog/README.md) and push to main.
# A version that was already released is skipped, so ordinary commits only run
# the checks in check.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Is there something to release?
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      name: ${{ steps.v.outputs.name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      release: ${{ steps.v.outputs.release }}
      base: ${{ steps.v.outputs.base }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and look for its release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -nE 's/^extra\["bitchordVersionName"\] = "([^"]+)".*/\1/p' build.gradle.kts)
          beta=$(sed -nE 's/^extra\["bitchordBetaSuffix"\] = "([^"]*)".*/\1/p' build.gradle.kts)
          [ -n "$name" ] || { echo "versionName not found in build.gradle.kts"; exit 1; }
          full="$name"
          pre=false
          if [ -n "$beta" ]; then full="$name-$beta"; pre=true; fi
          echo "tag=v$full" >> "$GITHUB_OUTPUT"
          echo "name=$full" >> "$GITHUB_OUTPUT"
          echo "base=$name" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          if gh release view "v$full" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$full is already released; nothing to do."
          else
            # The notes come from the repo, not from GitHub's generator; a
            # release without them is stopped here, before anything is built.
            [ -f "changelog/$name/en.md" ] || {
              echo "::error::changelog/$name/en.md is missing. Add the release notes for $name (see changelog/README.md)."
              exit 1
            }
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish ${{ needs.version.outputs.tag }}
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup Secrets (Keystore & local.properties)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # An unsigned APK cannot update an installed app, so a release
          # without the key is a failure, not a quieter build.
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }

          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties
          echo "FISH_API_KEY=${{ secrets.FISH_API_KEY }}" >> local.properties

          echo "$KEYSTORE_BASE64" | base64 -d > auden-release.jks
          {
            echo "storeFile=auden-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The phone build also builds and bundles the watch app (see
      # app/build.gradle.kts); the TV app is its own module.
      - name: Build signed prod release APKs
        run: ./gradlew assembleProdRelease :tv:assembleProdRelease

      # AppUpdateChecker picks its APK by file name: "Auden-" for the phone
      # (universal first, then the device's ABI split) and "AudenTV-" for the
      # TV. The watch APK is named "AudenWear-" so neither prefix matches it.
      - name: Name the release assets
        env:
          NAME: ${{ needs.version.outputs.name }}
        run: |
          mkdir -p dist
          rename() { # <dir> <prefix>
            for f in "$1"/*.apk; do
              [ -e "$f" ] || continue
              b=$(basename "$f" .apk)
              case "$b" in
                *universal*) suffix="" ;;
                *arm64-v8a*) suffix="_arm64-v8a" ;;
                *armeabi-v7a*) suffix="_armeabi-v7a" ;;
                *x86_64*) suffix="_x86_64" ;;
                *x86*) suffix="_x86" ;;
                *) suffix="" ;;
              esac
              cp "$f" "dist/$2-v$NAME$suffix.apk"
            done
          }
          rename app/build/outputs/apk/prod/release Auden
          rename tv/build/outputs/apk/prod/release AudenTV
          for f in wearos/build/outputs/apk/prod/release/*.apk; do
            [ -e "$f" ] && cp "$f" "dist/AudenWear-v$NAME.apk"
          done
          ls -la dist
          ls dist/Auden-v$NAME.apk   # the universal phone APK must exist

      # The release body is the version's English changelog plus the install
      # notes. The app does not read this body: it fetches
      # changelog/<version>/<language>.md from the tagged commit.
      - name: Write the release notes
        env:
          BASE: ${{ needs.version.outputs.base }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          {
            cat "changelog/$BASE/en.md"
            cat <<EOF

          ## Install

          **Android** (8.0 / API 26+): installs straight over your current Auden with the same signing key, or updates from inside the app. Not sure which APK to take? Use the universal \`Auden-v$NAME.apk\`. The smaller ones are \`arm64-v8a\` (most phones), \`armeabi-v7a\` (old 32-bit phones) and \`x86_64\` (emulators, Chromebooks).

          **Android TV / Google TV / Fire TV** (8.0 / API 26+): use the universal \`AudenTV-v$NAME.apk\`, or the smaller \`AudenTV-v${NAME}_armeabi-v7a.apk\`, which suits most TVs and streaming sticks (\`arm64-v8a\` for newer boxes like the Shield or Chromecast with Google TV).

          **Wear OS** (Wear OS 3+): the watch app ships inside the phone app. Install or update it from the phone app's settings.
          EOF
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Auden ${{ needs.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          generate_release_notes: false
          files: dist/*.apk

  # Fixed-name copies of the newest stable release's APKs, so a website can link
  # https://github.com/Yahel0506/Auden/releases/latest/download/Auden.apk and
  # always hand out the current version. The names deliberately avoid the
  # "Auden-" / "AudenTV-" prefixes AppUpdateChecker matches on. Runs on every
  # push (and by hand), so it also fills in a release that predates this job.
  stable-links:
    name: Point the fixed download links at the latest release
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Copy the versioned APKs to fixed names
        run: |
          set -euo pipefail
          tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)   # newest non-prerelease
          echo "Latest release: $tag"
          mkdir -p stable && cd stable
          copy() {  # copy <versioned asset> <fixed name>
            if gh release download "$tag" --repo "$REPO" --pattern "$1" --clobber; then
              mv "$1" "$2"
              gh release upload "$tag" "$2" --repo "$REPO" --clobber
              rm -f "$2"
            else
              echo "No $1 in $tag; skipping $2"
            fi
          }
          copy "Auden-$tag.apk"             Auden.apk
          copy "Auden-${tag}_arm64-v8a.apk" Auden_arm64-v8a.apk
          copy "AudenTV-$tag.apk"           AudenTV.apk
          copy "AudenWear-$tag.apk"         AudenWear.apk
