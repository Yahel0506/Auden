name = "auden-dj"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# Cloudflare's rate limiter: a listener asks the DJ a handful of times per minute, never hundreds.
[[unsafe.bindings]]
name = "LIMITER"
type = "ratelimit"
namespace_id = "7001"
simple = { limit = 20, period = 60 }

# Cloudflare's own models, run inside the Worker: no key and no bill within the free daily allowance.
[ai]
binding = "AI"

[vars]
# The model that reads an ask. The plan it writes is a few lines of JSON.
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
